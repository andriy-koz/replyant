baseURL = "https://replyant.com/"
languageCode = "en-us"
title = "Replyant"
theme = "replyant"

[params]
  description = "AI Agent Development, Automation & Strategy"
  tagline = "Agents that survive production."
  leadsAPI = "https://vps-4849885-x.dattaweb.com/replyant/api/leads"
  ogImage = "/android-chrome-512x512.png"

[params.author]
  name = "Replyant"

[taxonomies]
  tag = "tags"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Services"
    url = "/services/"
    weight = 2
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 3
  [[menu.main]]
    name = "Lab"
    url = "/lab/"
    weight = 4
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 5
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 6

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github-dark"
    noClasses = true
    tabWidth = 2

[outputs]
  home = ["HTML", "RSS", "sitemap"]

[pagination]
  pagerSize = 10
