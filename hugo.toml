baseURL = "https://replyant.com/"
languageCode = "en-us"
title = "Replyant"
theme = "replyant"
enableGitInfo = true

[params]
  # Short positioning line: reused in the homepage <title>, llms.txt and the Organization schema.
  description = "AI Agent Development, Automation & Strategy"
  # Homepage meta / og / twitter description (keep 140-155 chars).
  metaDescription = "Replyant builds production AI agents, business automation, and AI strategy for operators: engineered, evaluated, and secured to survive real workloads."
  tagline = "Agents that survive production."
  leadsAPI = "https://vps-4849885-x.dattaweb.com/replyant/api/leads"
  ogImage = "/og-default.png"

[params.author]
  # PLACEHOLDER persona — replace with real founder
  name = "Elena Marsh"
  jobTitle = "Founder & Principal AI Engineer"
  url = "https://replyant.com/about/"
  bio = "Elena Marsh designs and ships production AI agents for operator-led companies. Her work focuses on agent security, evaluations, and automation that holds up after launch."

[frontmatter]
  lastmod = ["lastmod", ":git", "date", "publishDate"]

[taxonomies]
  tag = "tags"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Services"
    url = "/services/"
    weight = 2
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 3
  [[menu.main]]
    name = "Lab"
    url = "/lab/"
    weight = 4
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 5
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 6

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github-dark"
    noClasses = true
    tabWidth = 2

[outputs]
  home = ["HTML", "RSS", "sitemap", "llms"]

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    rel = "alternate"

# Related-posts engine: match on shared tags (primary), recency as tiebreaker.
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[pagination]
  pagerSize = 10
