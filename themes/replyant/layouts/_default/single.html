{{ define "main" }}
<article class="article">
  <div class="container-narrow">
    <header class="article-head">
      <p class="net-label">Replyant // {{ .Title }}</p>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="article-desc">{{ . }}</p>{{ end }}
    </header>
    <div class="post-content">{{ .Content }}</div>
  </div>
</article>
{{ end }}
