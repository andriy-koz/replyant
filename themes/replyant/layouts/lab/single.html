{{ define "main" }}
<article class="blog-post">
  <div class="container container-narrow">
    <header class="post-header">
      <div class="section-label">Technical</div>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      <h1>{{ .Title }}</h1>
      {{ with .Params.tags }}
      <div class="post-tags">
        {{ range . }}
          <span class="tag">{{ . }}</span>
        {{ end }}
      </div>
      {{ end }}
    </header>
    <div class="post-content">
      {{ .Content }}
    </div>
    <aside class="lab-cta">
      <p>We build these systems for clients. <a href="/blog/">See how we approach AI projects</a>, or <a href="/#lead-magnet">get in touch</a>.</p>
    </aside>
    <footer class="post-footer">
      <a href="/lab/" class="back-link">&larr; Back to Lab</a>
    </footer>
  </div>
</article>
{{ end }}
