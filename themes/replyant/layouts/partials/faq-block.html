{{- with .Params.faq -}}
{{- if gt (len .) 0 -}}
<section class="faq">
  <p class="net-label">FAQ // Common questions</p>
  {{ range . }}
  <details class="faq-item">
    <summary>{{ .q }}</summary>
    <div class="faq-answer">{{ .a | markdownify }}</div>
  </details>
  {{ end }}
</section>
{{- end -}}
{{- end -}}
