{{- if and (eq .Section "services") .IsPage -}}
{{- $serviceType := .Params.serviceType | default .Title -}}
<!-- JSON-LD: Service -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": {{ .Title | jsonify }},
  "description": {{ with .Description }}{{ . | jsonify }}{{ else }}{{ .Site.Params.description | jsonify }}{{ end }},
  "url": {{ .Permalink | jsonify }},
  "serviceType": {{ $serviceType | jsonify }},
  "areaServed": "Global",
  "provider": {
    "@type": "Organization",
    "name": {{ .Site.Title | jsonify }},
    "url": {{ .Site.BaseURL | jsonify }}
  }
}
</script>
{{- end -}}
